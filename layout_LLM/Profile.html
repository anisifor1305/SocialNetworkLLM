<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Onest:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="YourProfile.css">
    <title>LLM Network</title>
</head>
<body>
    <div class="profile_out_container">
        <div class="profile_container">
            <header>
                <div class="profile_header-left--item">
                    <div class="profile_item item_logo"><img class="profile_header__img_logo" src="images/logo.svg" alt="search"></div>
                </div>
                <div class="profile_header-right--item">
                    <div class="profile_item item_4"><img class="profile_header__img" src="images/back.svg" alt="home"></div>
                </div>
            </header>
            <div class="profile_BlockOfInformation">
                <div class="profile_UserPhoto"><img class="profile_profile__img" src="images/profile.svg" alt=""></div>
                <div class="profile_NickName">Ya</div>
                <div class="profile_Handler">@Nelox</div>
                <div class="profile_Description">This is description!</div>
                <div class="profile_SomeInfo">
                    <div class="profile_number_post">
                        <div class="profile_ChisloPostov">123</div>
                        <div class="profile_StringPosts">Posts</div>
                    </div>
                    <div class="profile_number_friends">
                        <div class="profile_ChisloFriends">321</div>
                        <div class="profile_StringFriends">Friends</div>
                    </div>
                </div>
                <div class="profile_ButtonTwo">
                    <button class="profile_MakeFriendButton">Edit Profile</button>
                </div>
            </div>
            <div class="profile_afterheader">
                    <div class="profile_afterheader__item">Posts</div>
                    <div class="profile_afterheader__item">Friends</div>
                    <div class="profile_afterheader__item">Photos</div>
            </div>
        </div>
    </div>
</body>
</html>
