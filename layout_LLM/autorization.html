<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Onest:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesAutorization.css">
    <title>LLM Network</title>
</head>
<body>
    <div class="out_container">
        <div class="container">
            <header>
                <div class="header-left--item">
                    <div class="item item_logo"><img class="header__img_logo" src="images/logo.svg" alt="search"></div>
                </div>
                <div class="header-right--item">
                    <div class="item item_3"><img class="header__img" src="images/search.svg" alt="search"></div>
                    <div class="item item_4"><img class="header__img" src="images/profile.svg" alt="home"></div>
                </div>
            </header>
            <div class="main_body">
                <div class="Entry">Вход</div>
                <div class="EmailForm">
                    <input class="Email" type="text" placeholder="Эллектронная почта">
                </div>
                <div class="PasswordForm">
                    <input class="Password" type="text" placeholder="Пароль">
                </div>
                <div class="FrgtPsswrd"><button class="BtnFrgtPswrd">Забыли пароль?</button></div>
                <div class="EnterBtn"><button class="ButtonEnter">Войти</button></div>
                <div class="bottom__panel">
                    <div>Нет аккаунта?</div>
                    <div class="RegistrationB"><button class="BtnRegistration">Регистрация</button></div>
                </div>  
            </div>
        </div>
    </div>
</body>
</html>
