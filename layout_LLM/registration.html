<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Onest:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesRegistration.css">
    <title>LLM Network</title>
</head>
<body>
    <div class="registration_out_container">
        <div class="registration_container">
            <header>
                <div class="registration_header-left--item">
                    <div class="registration_item item_logo"><img class="registration_header__img_logo" src="images/logo.svg" alt="search"></div>
                </div>
                <div class="registration_header-right--item">
                    <div class="registration_item item_3"><img class="registration_header__img" src="images/search.svg" alt="search"></div>
                    <div class="registration_item item_4"><img class="registration_header__img" src="images/profile.svg" alt="home"></div>
                </div>
            </header>
            <div class="registration_main_body">
                <div class="registration_Entry">Регистрация</div>
                 <div class="registration_NikForm">
                    <input class="registration_Nik" type="text" placeholder="Никнейм">
                </div>
                <div class="registration_HandlerForm">
                    <input class="registration_Handler" type="text" placeholder="Уникальное имя пользователя">
                </div>
                <div class="registration_EmailForm">
                    <input class="registration_Email" type="text" placeholder="Эллектронная почта">
                </div>
                <div class="registration_PasswordForm">
                    <input class="registration_Password" type="text" placeholder="Пароль">
                </div>
                <div class="registration_EnterBtn"><button class="registration_ButtonEnter">Зарегестрироваться</button></div>
                
            </div>
        </div>
    </div>
</body>
</html>
