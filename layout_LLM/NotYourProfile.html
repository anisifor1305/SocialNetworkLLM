<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Onest:wght@100..900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="NotYourProfile.css">
    <title>LLM Network</title>
</head>
<body>
    <div class="nyprofile_out_container">
        <div class="nyprofile_container">
            <header>
                <div class="nyprofile_header-left--item">
                    <div class="nyprofile_item item_logo"><img class="nyprofile_header__img_logo" src="images/logo.svg" alt="search"></div>
                </div>
                <div class="nyprofile_header-right--item">
                    <div class="nyprofile_item item_4"><img class="nyprofile_header__img" src="images/back.svg" alt="home"></div>
                </div>
            </header>
            <div class="nyprofile_BlockOfInformation">
                <div class="nyprofile_UserPhoto"><img class="nyprofile_profile__img" src="images/profile.svg" alt=""></div>
                <div class="nyprofile_NickName">Artyom Antsiferov</div>
                <div class="nyprofile_Handler">@lox</div>
                <div class="nyprofile_Description">This is description!</div>
                <div class="nyprofile_SomeInfo">
                    <div class="nyprofile_number_post">
                        <div class="nyprofile_ChisloPostov">123</div>
                        <div class="nyprofile_StringPosts">Posts</div>
                    </div>
                    <div class="nyprofile_number_friends">
                        <div class="nyprofile_ChisloFriends">321</div>
                        <div class="nyprofile_StringFriends">Friends</div>
                    </div>
                </div>
                <div class="nyprofile_ButtonTwo">
                    <button class="nyprofile_MakeFriendButton">Make Friend</button>
                    <button class="nyprofile_MessageButton">Message</button>
                </div>
            </div>
            <div class="nyprofile_afterheader">
                    <div class="nyprofile_afterheader__item">Posts</div>
                    <div class="nyprofile_afterheader__item">Friends</div>
                    <div class="nyprofile_afterheader__item">Photos</div>
            </div>
        </div>
    </div>
</body>
</html>
