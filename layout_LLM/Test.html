<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Example</title>
    <link rel="stylesheet" href="stylesTest.css">
</head>
<body>
    <div class="container">
        <div class="left-column">
            <ul>
                <li><span class="item active">Pocrafts</span><span class="price">$1.61</span></li>
                <li><span class="item">Map</span><span class="price">$3.50</span></li>
                <li><span class="item">Pinsie</span><span class="price">$2.00</span></li>
            </ul>
        </div>
        <div class="right-column">
            <div class="title-bar">
                <div class="search">
                    <input type="text" placeholder="Search">
                </div>
            </div>
            <div class="content">
                <div class="content-item">
                    <span class="content-text">IN TimeCV Ban60%</span>
                    <span class="content-price">$5.50</span>
                </div>
                <div class="content-item">
                    <span class="content-text">Food slideshow</span>
                    <span class="content-price">$5.00</span>
                </div>
            </div>
            <div class="footer">
                <input type="text" placeholder="trogocobacs.org">
            </div>
        </div>
    </div>
</body>
</html>
